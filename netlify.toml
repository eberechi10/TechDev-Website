# Netlify Configuration File

[build]
  # Command to run for production build
  command = "npm run build"
  
  # Directory where Vite outputs production files
  publish = "dist"

# Single-Page Application (SPA) redirect rule
# Ensures refreshing or deep linking on routes serves index.html properly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers for optimal performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
